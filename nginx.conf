# Worker process configuration
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Sendfile and timeout optimization
    sendfile        on;
    keepalive_timeout 65;

    # Upstream definition for Render Node Backend
    upstream backend_service {
        server microservice-pipeline-backend.onrender.com:443;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve static frontend web application
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Reverse proxy REST API & WebSocket requests to live Render backend
        location /api/ {
            proxy_pass https://backend_service/;

            # Dynamic HTTP version & upgrade headers for WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward original request headers and TLS settings
            proxy_set_header Host microservice-pipeline-backend.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;

            # Disable caching for live API data streams
            proxy_cache_bypass $http_upgrade;
        }
    }
}