events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Dynamic DNS Resolver required for Nginx to resolve external HTTPS URLs
    resolver 8.8.8.8 1.1.1.1 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # Serve static frontend web application
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Reverse proxy REST API & WebSocket requests to live Render backend
        location /api/ {
            # Proxy directly to the Render HTTPS domain
            proxy_pass https://microservice-pipeline-backend.onrender.com/;

            # WebSocket upgrade support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Header preservation
            proxy_set_header Host microservice-pipeline-backend.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Enable Server Name Indication (SNI) for Cloudflare/Render TLS
            proxy_ssl_server_name on;
            proxy_ssl_name microservice-pipeline-backend.onrender.com;

            proxy_cache_bypass $http_upgrade;
        }
    }
}