# Core worker settings
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    keepalive_timeout 65;

    # Dynamic DNS resolution for upstream HTTPS routing
    resolver 8.8.8.8 1.1.1.1 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # Static asset distribution
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Reverse proxy for REST API and WebSocket connections
        location /api/ {
            # Target URL without trailing slash preserves /api prefix in requests
            proxy_pass https://microservice-pipeline-backend.onrender.com;

            # HTTP 1.1 and protocol upgrade headers for WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Upstream header forwarding and SSL SNI configuration
            proxy_set_header Host microservice-pipeline-backend.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Cloudflare / Render TLS handshake resolution
            proxy_ssl_server_name on;
            proxy_ssl_name microservice-pipeline-backend.onrender.com;

            proxy_cache_bypass $http_upgrade;
        }
    }
}