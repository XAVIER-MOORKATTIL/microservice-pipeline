services:
  telemetry-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemetry_microservice_node
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      app-net:
        aliases:
          - backend

  frontend:
    image: state-sync-project-frontend
    container_name: state-sync-project-frontend-1
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - telemetry-engine
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge